name = "fgof-keys"
version = "0.1.0"
license = "MIT"
author = "FortranGoingOnForty"
maintainer = "FortranGoingOnForty"
copyright = "2026"
description = "Terminal key decoding helpers for modern Fortran tools"

[build]
auto-executables = false
auto-tests = true
auto-examples = true

[install]
library = true

[fortran]
implicit-typing = false
implicit-external = false
source-form = "free"

[dev-dependencies]
fgof-lineedit = { git = "https://github.com/FortranGoingOnForty/fgof-lineedit.git", tag = "v0.1.0" }
fgof-termios = { git = "https://github.com/FortranGoingOnForty/fgof-termios.git", tag = "v0.1.0" }
